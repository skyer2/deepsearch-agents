<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .layer-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .box-text { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .hint { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .layer { stroke-width: 3; rx: 20; }
      .box { fill: #ffffff; stroke-width: 2; rx: 12; filter: drop-shadow(0 4px 7px rgba(15, 23, 42, 0.12)); }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrow-green); stroke-dasharray: 8 7; }
      .arrow-slate { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow-slate); }
    </style>
  </defs>

  <rect width="1280" height="980" fill="#f8fafc"/>
  <text x="640" y="40" text-anchor="middle" class="title">深度研搜系统架构图</text>
  <text x="640" y="66" text-anchor="middle" class="small">领域 Harness 控制面 → Research StateGraph 调度 → Leaf Worker 按 Profile 直调 → MCP / LangChain 工具 → Artifact 外置原文</text>

  <!-- Layer 5 体验 -->
  <rect x="24" y="84" width="1232" height="108" class="layer" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="48" y="116" class="layer-title">体验层</text>
  <rect x="70" y="132" width="250" height="44" class="box" stroke="#0284c7"/>
  <text x="195" y="160" text-anchor="middle" class="box-title">React 研搜台</text>
  <rect x="350" y="132" width="250" height="44" class="box" stroke="#0284c7"/>
  <text x="475" y="160" text-anchor="middle" class="box-title">Phase 时间线 / HITL</text>
  <rect x="630" y="132" width="250" height="44" class="box" stroke="#0284c7"/>
  <text x="755" y="160" text-anchor="middle" class="box-title">Eval 面板 / Trace</text>
  <rect x="910" y="132" width="310" height="44" class="box" stroke="#0284c7"/>
  <text x="1065" y="160" text-anchor="middle" class="box-title">Markdown / PDF 下载</text>

  <!-- Layer 4 服务 -->
  <rect x="24" y="208" width="1232" height="118" class="layer" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="48" y="240" class="layer-title">服务层</text>
  <rect x="70" y="256" width="220" height="52" class="box" stroke="#16a34a"/>
  <text x="180" y="276" text-anchor="middle" class="box-title">FastAPI</text>
  <text x="180" y="296" text-anchor="middle" class="box-text">task / resume / upload</text>
  <rect x="320" y="256" width="220" height="52" class="box" stroke="#16a34a"/>
  <text x="430" y="276" text-anchor="middle" class="box-title">WebSocket</text>
  <text x="430" y="296" text-anchor="middle" class="box-text">phase / tool / HITL</text>
  <rect x="570" y="256" width="220" height="52" class="box" stroke="#16a34a"/>
  <text x="680" y="276" text-anchor="middle" class="box-title">/health</text>
  <text x="680" y="296" text-anchor="middle" class="box-text">依赖探针</text>
  <rect x="820" y="256" width="390" height="52" class="box" stroke="#16a34a"/>
  <text x="1015" y="276" text-anchor="middle" class="box-title">capabilities / metrics / memory</text>
  <text x="1015" y="296" text-anchor="middle" class="box-text">运行时能力面与观测</text>

  <!-- Layer 3 Harness -->
  <rect x="24" y="342" width="1232" height="150" class="layer" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="48" y="374" class="layer-title">Domain Harness 控制面</text>
  <rect x="54" y="396" width="220" height="72" class="box" stroke="#f59e0b"/>
  <text x="164" y="422" text-anchor="middle" class="box-title">AgentHarness.run</text>
  <text x="164" y="444" text-anchor="middle" class="box-text">plan / policy / budget</text>
  <rect x="300" y="396" width="220" height="72" class="box" stroke="#f59e0b"/>
  <text x="410" y="422" text-anchor="middle" class="box-title">Memory + Identity</text>
  <text x="410" y="444" text-anchor="middle" class="box-text">信任分级 / SUPERSEDE</text>
  <rect x="546" y="396" width="220" height="72" class="box" stroke="#f59e0b"/>
  <text x="656" y="422" text-anchor="middle" class="box-title">Context / Citation</text>
  <text x="656" y="444" text-anchor="middle" class="box-text">Brief + JIT + CCR</text>
  <rect x="792" y="396" width="220" height="72" class="box" stroke="#f59e0b"/>
  <text x="902" y="422" text-anchor="middle" class="box-title">LoopState</text>
  <text x="902" y="444" text-anchor="middle" class="box-text">checkpoint.json 权威</text>
  <rect x="1038" y="396" width="190" height="72" class="box" stroke="#f59e0b"/>
  <text x="1133" y="422" text-anchor="middle" class="box-title">MCP Token</text>
  <text x="1133" y="444" text-anchor="middle" class="box-text">task-scoped 身份</text>

  <!-- Layer 2 Runtime -->
  <rect x="24" y="508" width="1232" height="168" class="layer" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="48" y="540" class="layer-title">Runtime：Research StateGraph + Leaf Workers</text>
  <rect x="54" y="562" width="250" height="88" class="box" stroke="#7c3aed"/>
  <text x="179" y="590" text-anchor="middle" class="box-title">StateGraph</text>
  <text x="179" y="612" text-anchor="middle" class="box-text">intent → plan → dispatch</text>
  <text x="179" y="632" text-anchor="middle" class="box-text">Send fan-out / join</text>
  <rect x="330" y="562" width="170" height="88" class="box" stroke="#7c3aed"/>
  <text x="415" y="590" text-anchor="middle" class="box-title">web_researcher</text>
  <text x="415" y="614" text-anchor="middle" class="box-text">internet_search</text>
  <rect x="520" y="562" width="170" height="88" class="box" stroke="#7c3aed"/>
  <text x="605" y="590" text-anchor="middle" class="box-title">db_researcher</text>
  <text x="605" y="614" text-anchor="middle" class="box-text">SELECT + 护栏</text>
  <rect x="710" y="562" width="170" height="88" class="box" stroke="#7c3aed"/>
  <text x="795" y="590" text-anchor="middle" class="box-title">kb_researcher</text>
  <text x="795" y="614" text-anchor="middle" class="box-text">RAGFlow</text>
  <rect x="900" y="562" width="170" height="88" class="box" stroke="#7c3aed"/>
  <text x="985" y="590" text-anchor="middle" class="box-title">file / synthesis</text>
  <text x="985" y="614" text-anchor="middle" class="box-text">MD / PDF / HITL</text>
  <rect x="1090" y="562" width="140" height="88" class="box" stroke="#7c3aed"/>
  <text x="1160" y="590" text-anchor="middle" class="box-title">Profile</text>
  <text x="1160" y="614" text-anchor="middle" class="box-text">最小 tool</text>

  <!-- Layer 1 Tools / MCP -->
  <rect x="24" y="692" width="1232" height="140" class="layer" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="48" y="724" class="layer-title">工具层：MCP Capability Plane ↔ LangChain 直连</text>
  <rect x="54" y="744" width="230" height="68" class="box" stroke="#9333ea"/>
  <text x="169" y="770" text-anchor="middle" class="box-title">ToolGateway</text>
  <text x="169" y="792" text-anchor="middle" class="box-text">fail-closed / step policy</text>
  <rect x="308" y="744" width="230" height="68" class="box" stroke="#9333ea"/>
  <text x="423" y="770" text-anchor="middle" class="box-title">MCP Gateway</text>
  <text x="423" y="792" text-anchor="middle" class="box-text">token / pool / breaker</text>
  <rect x="562" y="744" width="160" height="68" class="box" stroke="#9333ea"/>
  <text x="642" y="770" text-anchor="middle" class="box-title">Tavily</text>
  <text x="642" y="792" text-anchor="middle" class="box-text">mcp 或 @tool</text>
  <rect x="746" y="744" width="160" height="68" class="box" stroke="#9333ea"/>
  <text x="826" y="770" text-anchor="middle" class="box-title">MySQL</text>
  <text x="826" y="792" text-anchor="middle" class="box-text">db_core 护栏</text>
  <rect x="930" y="744" width="160" height="68" class="box" stroke="#9333ea"/>
  <text x="1010" y="770" text-anchor="middle" class="box-title">RAGFlow</text>
  <text x="1010" y="792" text-anchor="middle" class="box-text">知识库问答</text>
  <rect x="1114" y="744" width="116" height="68" class="box" stroke="#9333ea"/>
  <text x="1172" y="770" text-anchor="middle" class="box-title">Files</text>
  <text x="1172" y="792" text-anchor="middle" class="box-text">Tasks</text>

  <!-- Data / stores -->
  <rect x="24" y="848" width="1232" height="108" class="layer" fill="#f1f5f9" stroke="#475569"/>
  <text x="48" y="880" class="layer-title">外置状态与数据源</text>
  <rect x="70" y="896" width="200" height="42" class="box" stroke="#475569"/>
  <text x="170" y="922" text-anchor="middle" class="box-text">Artifact / Evidence</text>
  <rect x="290" y="896" width="200" height="42" class="box" stroke="#475569"/>
  <text x="390" y="922" text-anchor="middle" class="box-text">Memory SQLite</text>
  <rect x="510" y="896" width="200" height="42" class="box" stroke="#475569"/>
  <text x="610" y="922" text-anchor="middle" class="box-text">MCP audit / tasks</text>
  <rect x="730" y="896" width="200" height="42" class="box" stroke="#475569"/>
  <text x="830" y="922" text-anchor="middle" class="box-text">MySQL / RAGFlow</text>
  <rect x="950" y="896" width="270" height="42" class="box" stroke="#475569"/>
  <text x="1085" y="922" text-anchor="middle" class="box-text">output/session：MD / PDF</text>

  <path class="arrow-blue" d="M 640 192 L 640 256"/>
  <path class="arrow-blue" d="M 640 326 L 640 396"/>
  <path class="arrow-blue" d="M 640 468 L 640 562"/>
  <path class="arrow-blue" d="M 640 650 L 640 744"/>
  <path class="arrow-slate" d="M 169 812 L 170 896"/>
  <path class="arrow-slate" d="M 423 812 L 390 896"/>
  <path class="arrow-slate" d="M 642 812 L 610 896"/>
  <path class="arrow-slate" d="M 826 812 L 830 896"/>
  <path class="arrow-slate" d="M 1172 812 L 1085 896"/>
  <path class="arrow-green" d="M 1015 256 C 1188 240 1195 150 1065 176"/>
  <text x="1168" y="210" text-anchor="middle" class="hint">WebSocket 回传</text>
  <text x="42" y="332" class="small">服务层只接请求；生产调度权威是 Research StateGraph，不再二次 create_deep_agent 路由</text>
  <text x="42" y="686" class="small">工人只看到 Profile 内工具；原文进 Artifact Store，短卡回窗口；MCP 默认关闭，打开后按 Server 切换</text>
</svg>
